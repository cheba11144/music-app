<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My Music</title>
<style>
:root{
  --bg:#0f0d16;--bg-sec:#181622;--bg-card:#232033;--bg-hover:#2f2a44;
  --acc:#7a5cff;--acc-h:#8f75ff;--text:#fff;--muted:#b8b0d1;
  --rad:14px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;outline:none;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:linear-gradient(135deg,var(--bg-sec),var(--bg));color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}

.header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:rgba(15,13,22,.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(122,92,255,.1);position:sticky;top:0;z-index:50}
.header h1{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
.h-btn{background:var(--bg-card);border:none;color:var(--text);width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer;transition:.2s;display:grid;place-items:center}
.h-btn:hover{background:var(--acc)}

.tabs{display:flex;padding:10px 16px;gap:8px;background:var(--bg-sec);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 16px;background:var(--bg-card);border:none;border-radius:20px;color:var(--muted);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;transition:.2s}
.tab.active{background:linear-gradient(135deg,var(--acc),#5e45b8);color:#fff;box-shadow:0 4px 15px rgba(122,92,255,.2)}
.tab:hover:not(.active){background:var(--bg-hover)}

.search{padding:10px 16px}
.search input{width:100%;padding:12px 16px;border-radius:12px;border:1px solid rgba(122,92,255,.2);background:var(--bg-card);color:var(--text);font-size:15px;transition:.2s}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(122,92,255,.15)}
.search input::placeholder{color:var(--muted)}

.content{flex:1;overflow-y:auto;padding:8px 16px 200px;scrollbar-width:thin;scrollbar-color:var(--acc) transparent}
.content::-webkit-scrollbar{width:5px}
.content::-webkit-scrollbar-thumb{background:var(--acc);border-radius:4px}

.sec{margin-bottom:24px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
.sec-t{font-size:18px;font-weight:700}
.sec-btn{background:none;border:none;color:var(--acc);font-size:14px;cursor:pointer;font-weight:500;padding:6px;white-space:nowrap}

.grid{display:grid;gap:14px}
.grid-art{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.grid-pl{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}

.card{background:var(--bg-card);border-radius:12px;padding:16px;cursor:pointer;transition:.2s}
.card:hover{background:var(--bg-hover);transform:translateY(-2px)}
.art-av{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--acc),#5e45b8);margin:0 auto 10px;display:grid;place-items:center;font-size:22px;font-weight:700}
.art-n,.pl-n{font-weight:600;font-size:14px;margin-bottom:4px}
.art-c,.pl-c{font-size:12px;color:var(--muted)}
.pl-acts{display:flex;gap:6px;margin-top:10px;justify-content:flex-end}
.pl-btn{background:var(--bg-hover);border:none;color:var(--muted);width:30px;height:30px;border-radius:50%;cursor:pointer;transition:.2s;font-size:14px;display:grid;place-items:center}
.pl-btn:hover{color:var(--acc);transform:scale(1.1)}
.pl-btn.del:hover{color:#ff5c5c}

.tr-list{display:flex;flex-direction:column;gap:6px}
.tr-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg-card);border-radius:10px;transition:.15s}
.tr-item:hover{background:var(--bg-hover)}
.tr-item.active{background:rgba(122,92,255,.15);border-left:3px solid var(--acc)}
.tr-btn{width:34px;height:34px;border-radius:50%;background:var(--acc);border:none;color:#fff;font-size:13px;cursor:pointer;display:grid;place-items:center;transition:.2s;flex-shrink:0}
.tr-btn:hover{background:var(--acc-h);transform:scale(1.05)}
.tr-info{flex:1;min-width:0}
.tr-t{font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-a{font-size:13px;color:var(--muted);margin-top:2px}
.tr-dur{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:42px;text-align:right}
.tr-act{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:6px;transition:.2s}
.tr-act:hover{color:#ff5c5c}

.player{position:fixed;bottom:0;left:0;right:0;background:rgba(20,18,28,.98);backdrop-filter:blur(16px);padding:12px 16px 20px;border-top:1px solid rgba(122,92,255,.12);z-index:100}
.p-track{display:flex;align-items:center;gap:12px;margin-bottom:10px;cursor:pointer}
.p-art{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--acc),#5e45b8);display:grid;place-items:center;font-size:18px;flex-shrink:0}
.p-info{flex:1;min-width:0}
.p-t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-a{font-size:12px;color:var(--muted);margin-top:1px}
.p-cont{width:100%;height:4px;background:rgba(122,92,255,.2);border-radius:2px;cursor:pointer;margin-bottom:8px}
.p-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--acc),#9b7fff);border-radius:2px;transition:width .1s linear}
.p-time{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:10px;font-variant-numeric:tabular-nums}

.ctrls{display:flex;align-items:center;justify-content:center;gap:18px}
.c-btn{background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;transition:.2s;padding:6px}
.c-btn:hover{color:var(--acc);transform:scale(1.1)}
.c-btn.main{width:48px;height:48px;border-radius:50%;background:var(--acc);color:#fff;font-size:20px;display:grid;place-items:center;box-shadow:0 4px 15px rgba(122,92,255,.2)}
.c-btn.main:hover{transform:scale(1.08);background:var(--acc-h)}
.c-btn.act{color:var(--acc)}
/* ✅ Сдвиг перемешивания вправо от "следующий трек", но группа остаётся по центру */
#shufBtn{margin-left:12px}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:200;opacity:0;pointer-events:none;transition:.2s}
.modal.active{opacity:1;pointer-events:auto}
.m-box{background:var(--bg-sec);border-radius:var(--rad);padding:24px;width:90%;max-width:420px;box-shadow:0 15px 40px rgba(0,0,0,.5);transform:translateY(10px);transition:.2s;max-height:90vh;display:flex;flex-direction:column}
.modal.active .m-box{transform:translateY(0)}
.m-t{font-size:18px;font-weight:700;margin-bottom:12px}
.m-in{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(122,92,255,.2);background:var(--bg-card);color:var(--text);font-size:15px;margin-bottom:12px}
.m-in:focus{border-color:var(--acc)}
.m-list{flex:1;overflow-y:auto;margin-bottom:12px;display:flex;flex-direction:column;gap:6px}
.m-act{display:flex;gap:10px;justify-content:flex-end}
.btn{padding:10px 18px;border-radius:10px;border:none;font-size:14px;font-weight:500;cursor:pointer;transition:.2s}
.btn-c{background:var(--bg-card);color:var(--muted)}
.btn-k{background:linear-gradient(135deg,var(--acc),#5e45b8);color:#fff}
.btn:hover{transform:translateY(-1px)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.e-ic{font-size:40px;margin-bottom:12px;opacity:.5}

.vol-wrap{position:relative;display:flex;align-items:center}
.vol-slider{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--bg-card);padding:10px;border-radius:10px;display:none;flex-direction:column;gap:8px;min-width:120px}
.vol-wrap:hover .vol-slider{display:flex}
.vol-slider input{width:100%;height:4px;-webkit-appearance:none;background:rgba(122,92,255,.2);border-radius:2px;cursor:pointer}
.vol-slider input::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--acc);cursor:pointer}

@media(max-width:480px){.header{padding:12px 14px}.tabs{padding:8px 12px}.content{padding:8px 12px 200px}}
</style>
</head>
<body>

<div class="header">
  <h1>🎵 My Music</h1>
  <button class="h-btn" id="addBtn" title="Добавить треки">➕</button>
</div>
<input type="file" id="fileInput" accept="audio/*" multiple style="display:none">

<div class="tabs">
  <button class="tab active" data-view="tracks" onclick="window.setView('tracks')">🎧 Треки</button>
  <button class="tab" data-view="artists" onclick="window.setView('artists')">👤 Артисты</button>
  <button class="tab" data-view="playlists" onclick="window.setView('playlists')">📋 Плейлисты</button>
</div>

<div class="search">
  <!-- ✅ Поиск работает мгновенно через oninput -->
  <input type="text" id="search" placeholder="Поиск трека или артиста..." oninput="state.search=this.value.toLowerCase(); window.render()">
</div>

<main class="content" id="content"></main>

<div class="player">
  <div class="p-track" id="pClick">
    <div class="p-art">🎵</div>
    <div class="p-info"><div class="p-t" id="pTitle">Ничего не играет</div><div class="p-a" id="pArtist"></div></div>
  </div>
  <div class="p-cont" id="progCont"><div class="p-bar" id="prog"></div></div>
  <div class="p-time"><span id="cTime">0:00</span><span id="dTime">0:00</span></div>
  <div class="ctrls">
    <div class="vol-wrap">
      <button class="c-btn" id="volBtn">🔊</button>
      <div class="vol-slider"><input type="range" id="volSlider" min="0" max="1" step="0.01" value="1"></div>
    </div>
    <button class="c-btn" id="prevBtn">⏮</button>
    <button class="c-btn main" id="playBtn">▶</button>
    <button class="c-btn" id="nextBtn">⏭</button>
    <button class="c-btn" id="shufBtn">🔀</button>
  </div>
</div>

<audio id="audio"></audio>

<div class="modal" id="plModal">
  <div class="m-box">
    <div class="m-t">Новый плейлист</div>
    <input type="text" class="m-in" id="plInput" placeholder="Название">
    <div class="m-act">
      <button class="btn btn-c" onclick="window.closeModals()">Отмена</button>
      <button class="btn btn-k" onclick="window.createPL()">Создать</button>
    </div>
  </div>
</div>

<div class="modal" id="pickerModal">
  <div class="m-box">
    <div class="m-t">Нажмите на трек, чтобы добавить/убрать</div>
    <div class="m-list" id="pickerList"></div>
    <div class="m-act">
      <button class="btn btn-c" onclick="window.closeModals()">Готово</button>
    </div>
  </div>
</div>

function getMainArtist(fullName) {
  const base = fullName.split(' - ')[0].trim();
  return base.split(/\s*(?:feat\.?|ft\.?|&|x|,|\/|;|при\s?уч\.?)\s*/i)[0].trim() || 'Неизвестный';
}

let tracks = rawTracks.map((t, i) => ({
  id: 'raw_' + (i + 1), name: t.name, file: t.file,
  artist: getMainArtist(t.name),
  title: t.name.includes(' - ') ? t.name.split(' - ').slice(1).join(' - ').trim() : t.name,
  duration: null, isLocal: false
}));

let playlists = [];
try { const s = localStorage.getItem('myMusic_pl'); if(s) playlists = JSON.parse(s); } catch(e){}
if (!playlists.length) playlists = [
  {id:1, name:"🔥 В тачку", trackIds:[]},
  {id:2, name:"😴 На ночь", trackIds:[]}
];

// ================= INDEXEDDB =================
let db;
function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open('MusicDB', 1);
    req.onupgradeneeded = e => { db = e.target.result; db.createObjectStore('tracks', {keyPath:'id'}); };
    req.onsuccess = e => { db = e.target.result; res(); };
    req.onerror = () => rej(req.error);
  });
}
function saveTrackToDB(track) {
  return new Promise(res => {
    if(!db) return res();
    db.transaction(['tracks'], 'readwrite').objectStore('tracks').put(track).onsuccess = () => res();
  });
}
async function loadTracksFromDB() {
  if(!db) return;
  return new Promise(res => {
    const r = db.transaction(['tracks'], 'readonly').objectStore('tracks').getAll();
    r.onsuccess = () => {
      const local = r.result.map(t => ({...t, isLocal:true}));
      tracks = [...tracks.filter(t=>!t.isLocal), ...local];
      window.render();
      res();
    };
    r.onerror = () => res();
  });
}

// ================= GLOBAL FUNCTIONS (для onclick) =================
window.setView = (v) => { state.view = v; state.artist = state.playlist = null; window.render(); };
window.back = () => { state.view = 'tracks'; state.artist = state.playlist = null; window.render(); };
window.closeModals = () => $$('.modal').forEach(m => m.classList.remove('active'));
window.openPlaylist = (id) => { state.playlist = id; state.view = 'playlist'; window.render(); };
window.goToArtist = (a) => { state.artist = a; state.view = 'artist'; window.render(); };

window.createPL = () => {
  const n = $('#plInput').value.trim(); if(!n) return;
  const p = {id:Date.now(), name:n, trackIds:[]};
  playlists.push(p); savePL(); window.closeModals();
  state.playlist = p.id; state.view = 'playlist'; window.render();
  $('#plInput').value = '';
};

window.removeTr = (id) => {
  const p = playlists.find(x=>x.id===state.playlist); if(!p) return;
  p.trackIds = p.trackIds.filter(x=>x!==id); savePL(); window.render();
};

window.openTrackPicker = () => {
  if(!state.playlist) return;
  const pl = playlists.find(p=>p.id===state.playlist);
  $('#pickerList').innerHTML = tracks.map(t => {
    const added = pl.trackIds.includes(t.id);
    return `<div class="tr-item ${added?'active':''}" onclick="window.toggleTrack('${t.id}')" style="cursor:pointer">
      <div class="tr-info"><div class="tr-t">${t.title}</div><div class="tr-a">${t.artist}</div></div>
      ${added?'<span style="color:var(--acc)">✓</span>':''}
    </div>`;
  }).join('');
  $('#pickerModal').classList.add('active');
};

window.toggleTrack = (tid) => {
  const pl = playlists.find(p=>p.id===state.playlist); if(!pl) return;
  const idx = pl.trackIds.indexOf(tid);
  idx === -1 ? pl.trackIds.push(tid) : pl.trackIds.splice(idx, 1);
  savePL(); window.render();
  window.openTrackPicker(); // Обновить галочки в модалке без закрытия
};

window.playById = (id, queue) => {
  const t = tracks.find(x=>x.id===id); if(!t) return;
  state.queue = queue || (state.playlist?playlists.find(p=>p.id===state.playlist).trackIds.map(i=>tracks.find(x=>x.id===i)).filter(Boolean)
    : state.artist?tracks.filter(x=>x.artist===state.artist):[...tracks]);
  state.qIdx = state.queue.findIndex(x=>x.id===id); window.load(t);
};
window.playPL = (id) => { const p=playlists.find(x=>x.id===id); if(p?.trackIds.length) window.playById(p.trackIds[0], p.trackIds.map(i=>tracks.find(x=>x.id===i)).filter(Boolean)); };
window.playArt = (n) => { const q=tracks.filter(x=>x.artist===n); if(q.length) window.playById(q[0].id, q); };

window.togglePlay = () => { audio.paused?audio.play().catch(()=>{}):audio.pause(); $('#playBtn').textContent=audio.paused?'▶':'⏸'; };
window.prev = () => { if(!state.queue.length)return; if(audio.currentTime>3) audio.currentTime=0; else { state.qIdx=(state.qIdx-1+state.queue.length)%state.queue.length; if(state.queue[state.qIdx]) window.load(state.queue[state.qIdx]); } };
window.next = () => { if(!state.queue.length)return; state.qIdx = state.shuf?Math.floor(Math.random()*state.queue.length):(state.qIdx+1)%state.queue.length; if(state.queue[state.qIdx]) window.load(state.queue[state.qIdx]); };
window.seek = (e) => { if(!audio.duration)return; audio.currentTime=((e.clientX-$('#progCont').getBoundingClientRect().left)/$('#progCont').clientWidth)*audio.duration; };

window.load = (t) => {
  audio.src = t.file; audio.play().catch(()=>{}); $('#playBtn').textContent='⏸';
  $('#pTitle').textContent = t.title; $('#pArtist').textContent = t.artist;
  window.render();
};

function savePL() { try{localStorage.setItem('myMusic_pl',JSON.stringify(playlists));}catch(e){} }
function curTrack() { return state.queue[state.qIdx]; }
function fmt(s) { return (!s||!isFinite(s))?'0:00':`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`; }
function updateVolIcon(){ $('#volBtn').textContent = audio.volume==0?'🔇':audio.volume<0.5?'🔉':'🔊'; }

// ================= РЕНДЕР =================
window.render = () => {
  // Обновляем табы
  $$('.tab').forEach(t => t.classList.toggle('active', t.dataset.view===state.view));
  
  let html='';
  const f = t => t.name.toLowerCase().includes(state.search)||t.artist.toLowerCase().includes(state.search);
  
  if (state.view==='tracks') {
    const list = tracks.filter(f);
    html = `<div class="sec"><div class="sec-h"><div class="sec-t">Все треки</div><span style="color:var(--muted)">${list.length}</span></div>
    <div class="tr-list">${list.length?list.map(t=>rTr(t,false)).join(''):'<div class="empty"><div class="e-ic">🎧</div>Треки не найдены</div>'}</div></div>`;
  } else if (state.view==='artists') {
    const arts = [...new Set(tracks.map(t=>t.artist))].sort();
    const list = state.search?arts.filter(a=>a.toLowerCase().includes(state.search)):arts;
    html = `<div class="sec"><div class="sec-h"><div class="sec-t">Артисты</div><span style="color:var(--muted)">${list.length}</span></div>
    <div class="grid grid-art">${list.length?list.map(a=>`<div class="card" onclick="window.goToArtist('${a.replace(/'/g,"\\'")}')"><div class="art-av">${a[0]}</div><div class="art-n">${a}</div><div class="art-c">${tracks.filter(x=>x.artist===a).length} трек${'ов'.slice(-2)}</div></div>`).join(''):'<div class="empty">Нет артистов</div>'}</div></div>`;
  } else if (state.view==='playlists') {
    html = `<div class="sec"><div class="sec-h"><div class="sec-t">Плейлисты</div><button class="sec-btn" onclick="$('#plModal').classList.add('active')">+ Создать</button></div>
    <div class="grid grid-pl">${playlists.length?playlists.map(p=>`<div class="card" onclick="window.openPlaylist(${p.id})"><div class="pl-n">${p.name}</div><div class="pl-c">${p.trackIds.length} трек${'ов'.slice(-2)}</div><div class="pl-acts"><button class="pl-btn" onclick="event.stopPropagation();window.playPL(${p.id})">▶</button><button class="pl-btn" onclick="event.stopPropagation();window.renamePL(${p.id})">✏️</button><button class="pl-btn del" onclick="event.stopPropagation();window.delPL(${p.id})">🗑️</button></div></div>`).join(''):'<div class="empty">Нет плейлистов</div>'}</div></div>`;
  } else if (state.view==='playlist') {
    const pl = playlists.find(p=>p.id===state.playlist); if(!pl) return window.back();
    const list = pl.trackIds.map(id=>tracks.find(t=>t.id===id)).filter(t=>t&&f(t));
    html = `<div class="sec-h"><button class="sec-btn" onclick="window.back()">← Назад</button><div style="flex:1;text-align:right"><div style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${pl.name}</div><div style="color:var(--muted)">${list.length} треков</div></div><button class="sec-btn" style="background:var(--acc);color:#fff;padding:8px 16px;border-radius:16px" onclick="window.openTrackPicker()">➕ Добавить</button></div><div class="tr-list">${list.length?list.map(t=>rTr(t,true)).join(''):'<div class="empty">Плейлист пуст</div>'}</div>`;
  } else if (state.view==='artist') {
    const list = tracks.filter(t=>t.artist===state.artist&&f(t));
    html = `<div class="sec-h"><button class="sec-btn" onclick="window.back()">← Назад</button><div style="display:flex;gap:12px;align-items:center"><div class="art-av">${state.artist[0]}</div><div><div style="font-weight:700">${state.artist}</div><div style="color:var(--muted)">${list.length} треков</div></div></div><button class="sec-btn" style="background:var(--acc);color:#fff;padding:6px 14px;border-radius:16px" onclick="window.playArt('${state.artist.replace(/'/g,"\\'")}')">▶ Все</button></div><div class="tr-list">${list.length?list.map(t=>rTr(t,false)).join(''):'<div class="empty">Нет треков</div>'}</div>`;
  }
  cont.innerHTML = html; cont.scrollTop=0;
};

function rTr(t, showRemove=false) {
  const isAct = curTrack()?.id===t.id;
  return `<div class="tr-item ${isAct?'active':''}">
    <button class="tr-btn" onclick="window.playById('${t.id}')">${isAct&&!audio.paused?'⏸':'▶'}</button>
    <div class="tr-info"><div class="tr-t">${t.title}</div><div class="tr-a">${t.artist}</div></div>
    <div class="tr-dur">${t.duration?fmt(t.duration):'--:--'}</div>
    ${showRemove?`<button class="tr-act" onclick="window.removeTr('${t.id}')">🗑️</button>`:''}
  </div>`;
}

window.renamePL = (id) => { const p=playlists.find(x=>x.id===id); if(!p) return; const n=prompt('Новое название:',p.name); if(n?.trim()){p.name=n.trim();savePL();window.render();} };
window.delPL = (id) => { if(confirm('Удалить плейлист?')){playlists=playlists.filter(x=>x.id!==id);savePL();if(state.playlist===id)window.back();window.render();} };

// ================= INIT =================
document.addEventListener('DOMContentLoaded', () => {
  window.render();
  
  // Открываем базу и подгружаем треки в фоне
  openDB().then(loadTracksFromDB).catch(console.error);
  
  // Плеер события
  $('#playBtn').onclick = window.togglePlay;
  $('#prevBtn').onclick = window.prev;
  $('#nextBtn').onclick = window.next;
  $('#shufBtn').onclick = () => { state.shuf = !state.shuf; $('#shufBtn').classList.toggle('act', state.shuf); };
  $('#progCont').onclick = window.seek;
  $('#pClick').onclick = () => { state.view = state.playlist?'playlist':state.artist?'artist':'tracks'; window.render(); };
  $('#addBtn').onclick = () => $('#fileInput').click();
  $('#fileInput').onchange = handleFiles;
  $('#volBtn').onclick = () => { audio.volume = audio.volume > 0 ? 0 : 1; $('#volSlider').value = audio.volume; updateVolIcon(); };
  $('#volSlider').oninput = e => { audio.volume = e.target.value; updateVolIcon(); };
  updateVolIcon();
  
  audio.addEventListener('timeupdate', () => {
    if(audio.duration&&isFinite(audio.duration)) {
      $('#prog').style.width=Math.min((audio.currentTime/audio.duration)*100,100)+'%';
      $('#cTime').textContent=fmt(audio.currentTime);
    }
  });
  audio.addEventListener('loadedmetadata', () => {
    $('#dTime').textContent = fmt(audio.duration);
    const cur = curTrack(); if(cur && !cur.duration) cur.duration = audio.duration;
  });
  audio.addEventListener('ended', window.next);
});

// ================= ФАЙЛЫ =================
async function handleFiles(e) {
  const f=[...e.target.files].filter(x=>x.type.includes('audio'));
  for(const file of f){
    const reader=new FileReader();
    reader.onload=async ev=>{
      const n=file.name.replace(/\.[^/.]+$/,'');
      const tr={id:'local_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),name:n,file:ev.target.result,artist:getMainArtist(n),title:n.includes(' - ')?n.split(' - ').slice(1).join(' - ').trim():n,duration:null,isLocal:true};
      tracks.push(tr); try{await saveTrackToDB(tr);}catch(err){} window.render();
    }; reader.readAsDataURL(file);
  } e.target.value='';
}
</script>

<script>
// Авто-обновление версии для обхода кэша Телеграма
(function(){
  const url = new URL(window.location.href);
  const currentV = url.searchParams.get('v');
  const fileVersion = '1.3'; // 👈 МЕНЯЙ ЭТО ЧИСЛО при каждом обновлении файла
  
  if (currentV !== fileVersion) {
    url.searchParams.set('v', fileVersion);
    window.location.replace(url.toString());
  }
})();
</script>
